<!DOCTYPE html>
<!--
  Source for the Working Dev's Hero OG/social card (1200x630).
  Regenerate: serve the repo root over http, open this file in a 1200x630
  viewport (e.g. Playwright), and screenshot the viewport as PNG. The output
  lives at public/og-image.png.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../public/fonts/BricolageGrotesque-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0f0f0f;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1152px;
    height: 582px;
    border-radius: 28px;
    border: 1px solid rgba(167, 139, 250, 0.25);
    background:
      radial-gradient(ellipse 900px 600px at 18% 50%, rgba(74, 29, 106, 0.55), transparent 65%),
      radial-gradient(ellipse 700px 500px at 95% 10%, rgba(139, 92, 246, 0.18), transparent 60%),
      #131217;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 80px;
  }
  .logo-tile {
    flex-shrink: 0;
    width: 280px;
    height: 280px;
    border-radius: 56px;
    background: #2D0F2A;
    border: 2px solid #a78bfa;
    box-shadow: 0 0 80px rgba(139, 92, 246, 0.45);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-tile img { width: 100%; height: 100%; object-fit: cover; }
  .text { display: flex; flex-direction: column; align-items: flex-start; }
  .eyebrow {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a78bfa;
    margin-bottom: 20px;
  }
  .title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 58px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 24px;
    white-space: nowrap;
  }
  .title .grad {
    background: linear-gradient(90deg, #A78BFA, #EC4899);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .tagline {
    font-size: 26px;
    font-weight: 500;
    color: #8d8898;
    margin-bottom: 40px;
  }
  .url-chip {
    display: inline-flex;
    align-items: center;
    padding: 14px 28px;
    border-radius: 14px;
    background: rgba(74, 29, 106, 0.5);
    border: 1px solid rgba(167, 139, 250, 0.4);
    font-size: 26px;
    font-weight: 600;
    color: #d6c9ee;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-tile">
      <img src="../src/assets/images/hero-mascot.png" alt="" />
    </div>
    <div class="text">
      <div class="eyebrow">Working Dev's Hero</div>
      <div class="title">We Build <span class="grad">AI&#8209;Powered</span><br />Software That Ships</div>
      <div class="tagline">From concept to production — your AI-enabled development partner.</div>
      <div class="url-chip">workingdevshero.com</div>
    </div>
  </div>
</body>
</html>
