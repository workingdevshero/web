<!DOCTYPE html>
<!--
  Text overlay for the Working Dev's Hero og:video and og:image (1200x630).
  The background is transparent: scripts/build-og-video.mjs screenshots this
  page and composites it over the Midnight Rooftop Flow loop with ffmpeg.
  Open with ?preview to see it over the loop's first frame while tuning
  (run the build once first so .tmp/og-video-frame.png exists).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../public/fonts/BricolageGrotesque-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: transparent; }
  body.preview { background: url('../.tmp/og-video-frame.png') no-repeat; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  /* Darkens the empty sky on the left so the type reads over the city glow. */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(14, 8, 24, 0.6) 0%, rgba(14, 8, 24, 0.35) 40%, transparent 58%);
  }
  .text {
    position: absolute;
    left: 64px;
    top: 118px;
    width: 600px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #c4b5fd;
    margin-bottom: 18px;
  }
  .title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
    line-height: 1.12;
    margin-bottom: 30px;
    white-space: nowrap;
    text-shadow: 0 2px 24px rgba(14, 8, 24, 0.6);
  }
  .title .grad {
    background: linear-gradient(90deg, #A78BFA, #EC4899);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: none;
  }
  .url-chip {
    display: inline-flex;
    align-items: center;
    padding: 12px 24px;
    border-radius: 14px;
    background: rgba(45, 15, 42, 0.75);
    border: 1px solid rgba(167, 139, 250, 0.5);
    font-size: 24px;
    font-weight: 600;
    color: #e4dbf5;
  }
</style>
</head>
<body>
  <div class="scrim"></div>
  <div class="text">
    <div class="eyebrow">Working Dev's Hero</div>
    <div class="title">We Build <span class="grad">AI&#8209;Powered</span><br />Software That Ships</div>
    <div class="url-chip">workingdevshero.com</div>
  </div>
  <script>
    if (new URLSearchParams(location.search).has('preview')) document.body.classList.add('preview');
  </script>
</body>
</html>
