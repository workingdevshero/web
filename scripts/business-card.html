<!DOCTYPE html>
<!--
  Source for the Working Dev's Hero business card (front + back).

  Rendered to brand/business-cards/ by scripts/build-business-card.mjs — do not
  screenshot this by hand unless you are tuning. The card is a standard US size
  (3.5in x 2in); the build renders it at 2x device scale, so the PNGs come out
  2100x1200 (600 DPI) and drop straight into a print order.

  Add ?side=front | ?side=back to render one side, or ?side=sheet for both side
  by side (the tuning view). Add ?guides to overlay the trim and safe margins.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Working Dev's Hero — business card</title>
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../public/fonts/BricolageGrotesque-ExtraBold.woff2') format('woff2');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../social/reintroduction-2026/generator/fonts/bricolage-600.woff2') format('woff2');
    font-weight: 600; font-style: normal;
  }
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../social/reintroduction-2026/generator/fonts/bricolage-400.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }

  :root {
    --card-w: 1050px;
    --card-h: 600px;
    --pad: 78px;               /* ~1/4in at 300dpi — well inside the trim */
    --violet: #A78BFA;
    --pink: #EC4899;
    --muted: #B9AEC9;
    --grad: linear-gradient(90deg, #A78BFA, #EC4899);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: var(--card-w);
    height: var(--card-h);
    overflow: hidden;
    font-family: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Sheet view: two cards side by side with a gap, for tuning/preview. */
  body.sheet {
    width: calc(var(--card-w) * 2 + 40px);
    height: calc(var(--card-h) + 40px);
    display: flex;
    gap: 40px;
    padding: 20px;
    background: #0b0710;
  }
  body.sheet .card { display: flex !important; }

  .card {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    flex: 0 0 auto;
    overflow: hidden;
    color: #fff;
    display: none;
    background:
      radial-gradient(ellipse 820px 520px at 104% -8%, rgba(124, 58, 237, 0.40), transparent 62%),
      radial-gradient(ellipse 720px 560px at -8% 108%, rgba(162, 28, 175, 0.34), transparent 60%),
      linear-gradient(150deg, #2c1028 0%, #1b0a1a 58%, #120712 100%);
  }
  body[data-side="front"] .card.front,
  body[data-side="back"]  .card.back { display: block; }

  /* Faint code-ish grid, keeps the flat purple from feeling empty. */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(167, 139, 250, 0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167, 139, 250, 0.055) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 35%, transparent 100%);
    mask-image: radial-gradient(ellipse 70% 90% at 50% 50%, #000 35%, transparent 100%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 120% 120% at 50% 50%, transparent 55%, rgba(8, 4, 10, 0.55) 100%);
  }

  .grad {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }

  /* ---------- Front ---------- */
  .front-inner {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--pad);
  }
  .front-text { position: relative; z-index: 2; max-width: 650px; }
  .eyebrow {
    font-size: 19px; font-weight: 600; letter-spacing: 5px;
    text-transform: uppercase; color: var(--violet);
    margin-bottom: 22px;
  }
  .wordmark {
    font-size: 80px; font-weight: 800; line-height: 0.94;
    letter-spacing: -1.5px; color: #fff; margin-bottom: 24px;
  }
  .tagline {
    font-size: 26px; font-weight: 400; line-height: 1.32; color: var(--muted);
    margin-bottom: 26px;
  }
  .rule { width: 92px; height: 5px; border-radius: 3px; background: var(--grad); margin-bottom: 22px; }
  .url { font-size: 23px; font-weight: 600; letter-spacing: 0.5px; color: #fff; }
  .url .dot { color: var(--pink); }

  .mascot-wrap {
    position: relative; z-index: 2;
    width: 300px; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .mascot-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 55%, rgba(139, 92, 246, 0.42), transparent 66%);
  }
  .mascot { position: relative; z-index: 2; height: 400px; width: auto; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.5)); }

  /* ---------- Back ---------- */
  .back-inner {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--pad);
  }
  .back-left { position: relative; z-index: 2; }
  .name { font-size: 60px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
  .role {
    font-size: 21px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--violet); margin-top: 12px;
  }
  .back-left .rule { margin: 26px 0 26px; }
  .contact { list-style: none; display: grid; gap: 14px; }
  .contact li { display: flex; align-items: baseline; gap: 18px; }
  .contact .k {
    width: 96px; flex: 0 0 auto;
    font-size: 14px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: #8d7fa0;
  }
  .contact .v { font-size: 22px; font-weight: 400; color: #fff; }
  .contact .v .grad { font-weight: 600; }

  .back-right {
    position: relative; z-index: 2; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .mark { height: 178px; width: auto; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.5)); }
  .wordmark-sm { font-size: 25px; font-weight: 800; letter-spacing: 0.5px; white-space: nowrap; }

  /* ---------- Guides (tuning only) ---------- */
  body.guides .card::after {
    content: ''; position: absolute; inset: 38px;
    border: 1px dashed rgba(236, 72, 153, 0.65); pointer-events: none;
  }
  body.guides .card::before {
    content: ''; position: absolute; inset: 0;
    border: 1px dashed rgba(167, 139, 250, 0.5); pointer-events: none;
  }
</style>
</head>
<body data-side="front">
  <!-- Front -->
  <section class="card front">
    <div class="grid"></div>
    <div class="vignette"></div>
    <div class="front-inner">
      <div class="front-text">
        <div class="eyebrow">AI-Enabled Software Studio</div>
        <h1 class="wordmark">Working Dev's<br /><span class="grad">Hero</span></h1>
        <p class="tagline">We build AI-powered software<br />that ships.</p>
        <div class="rule"></div>
        <div class="url">workingdevshero<span class="dot">.</span>com</div>
      </div>
      <div class="mascot-wrap">
        <div class="mascot-glow"></div>
        <img class="mascot" src="../brand/hero/logo-no-text.png" alt="" />
      </div>
    </div>
  </section>

  <!-- Back -->
  <section class="card back">
    <div class="grid"></div>
    <div class="vignette"></div>
    <div class="back-inner">
      <div class="back-left">
        <div class="name">Bobby</div>
        <div class="role">Founder &amp; Principal Engineer</div>
        <div class="rule"></div>
        <ul class="contact">
          <li><span class="k">Email</span><span class="v">bobby@workingdevshero.com</span></li>
          <li><span class="k">Web</span><span class="v">workingdevshero<span class="grad">.</span>com</span></li>
          <li><span class="k">GitHub</span><span class="v">@workingdevshero</span></li>
          <li><span class="k">X</span><span class="v">@workingdevshero</span></li>
        </ul>
      </div>
      <div class="back-right">
        <img class="mark" src="../brand/hero/logo-no-text.png" alt="" />
        <div class="wordmark-sm">Working Dev's <span class="grad">Hero</span></div>
      </div>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(location.search);
    const side = params.get('side') || 'front';
    document.body.dataset.side = side;
    if (side === 'sheet') document.body.classList.add('sheet');
    if (params.has('guides')) document.body.classList.add('guides');
  </script>
</body>
</html>
