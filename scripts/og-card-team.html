<!DOCTYPE html>
<!--
  Source for the /team OG/social card (1200x630).
  Regenerate: serve the repo root over http, open this file in a 1200x630
  viewport (e.g. Playwright), and screenshot the viewport as PNG. The output
  lives at public/og-team.png.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../public/fonts/BricolageGrotesque-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0f0f0f;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1152px;
    height: 582px;
    border-radius: 28px;
    border: 1px solid rgba(167, 139, 250, 0.25);
    background:
      radial-gradient(ellipse 900px 600px at 50% 110%, rgba(74, 29, 106, 0.55), transparent 65%),
      radial-gradient(ellipse 700px 500px at 95% 0%, rgba(139, 92, 246, 0.18), transparent 60%),
      #131217;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
  .text { text-align: center; }
  .eyebrow {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #a78bfa;
    margin-bottom: 16px;
  }
  .title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
    line-height: 1;
    margin-bottom: 16px;
  }
  .tagline {
    font-size: 28px;
    font-weight: 500;
    color: #8d8898;
  }
  .tagline .grad {
    background: linear-gradient(90deg, #A78BFA, #EC4899);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-weight: 700;
  }
  .squad { display: flex; gap: 24px; }
  .squad img {
    width: 148px;
    height: 148px;
    border-radius: 32px;
    border: 2px solid #a78bfa;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.35);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <div class="eyebrow">Working Dev's Hero</div>
      <div class="title">Meet the Squad</div>
      <div class="tagline">Two humans. Four AI agents. <span class="grad">Zero slop.</span></div>
    </div>
    <div class="squad">
      <img src="../src/assets/images/team/bobby.png" alt="" />
      <img src="../src/assets/images/team/dimitris.png" alt="" />
      <img src="../src/assets/images/team/claudius.png" alt="" />
      <img src="../src/assets/images/team/claudia.png" alt="" />
      <img src="../src/assets/images/team/moses.png" alt="" />
      <img src="../src/assets/images/team/neo.png" alt="" />
    </div>
  </div>
</body>
</html>
